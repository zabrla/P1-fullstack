{% extends 'base.html' %}

{% block conteudo %}
    <h2>Preencha os Dados</h2>
    
    {% if erro %}
        <p style="color: red; font-weight: bold;">{{ erro }}</p>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar Registro</button>
    </form>
{% endblock %}
